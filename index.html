<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DREAMSCANFOUND – 15 DAYS ON MARS</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./rosebud/game-defaults.css" />
    <script src="./rosebud/game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin: 0; padding: 0; background: #050505; overflow: hidden; }
      body { touch-action: none; font-family: 'VT323', monospace; color: #fff; }
      canvas { display: block; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root > * { pointer-events: auto; }
      #hud { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); display: none; gap: 6px; z-index: 5; }
      #hud button { font-family: 'Press Start 2P'; font-size: 10px; padding: 8px 10px; background: rgba(20,8,6,.9); color: #7effdc; border: 3px solid #ff8a3d; cursor: pointer; }
      #hud button:hover { background: #3a1a10; color: #fff; }
      .modal-back { position: fixed; inset: 0; background: rgba(5,2,1,.6); display: flex; align-items: center; justify-content: center; }
      .modal { position: relative; width: min(760px, 94vw); max-height: 88vh; overflow: auto; background: #170805; border: 5px solid #ff8a3d; box-shadow: 0 0 0 4px #000, 0 0 30px rgba(95,255,208,.25); padding: 18px 22px; font-size: 22px; }
      .modal.wide { width: min(1180px, 96vw); }
      .modal h2 { font-family: 'Press Start 2P'; font-size: 16px; color: #ff8a3d; margin: 4px 30px 12px 0; line-height: 1.5; }
      .modal h2.warn { color: #ff5a4a; }
      .modal h3 { font-family: 'Press Start 2P'; font-size: 11px; color: #7effdc; margin: 14px 0 6px; }
      .modal p { margin: 6px 0; }
      .modal .x { position: absolute; top: 8px; right: 8px; background: #3a1a10; color: #fff; border: 2px solid #ff8a3d; font-size: 18px; cursor: pointer; }
      .status { color: #7effdc; margin-bottom: 8px; }
      .acts { display: flex; flex-direction: column; gap: 6px; }
      .act { text-align: left; background: #2a120b; color: #fff; border: 3px solid #6a3a22; padding: 8px 12px; font-family: 'VT323'; font-size: 22px; cursor: pointer; }
      .act b { display: block; font-weight: normal; color: #ffe9c9; }
      .act small { color: #d9b28f; font-size: 19px; }
      .act.task { border-color: #ffe14d; }
      .act:hover:not([disabled]) { background: #4a2012; border-color: #ff8a3d; }
      .act[disabled] { opacity: .45; cursor: not-allowed; }
      .hint, .small { color: #c9a385; font-size: 18px; }
      .primary { margin-top: 14px; font-family: 'Press Start 2P'; font-size: 13px; background: #ff8a3d; color: #fff; border: 3px solid #fff0c9; padding: 12px 18px; cursor: pointer; }
      table { border-collapse: collapse; width: 100%; font-size: 20px; }
      td, th { padding: 3px 8px; border-bottom: 1px solid #3a1a10; text-align: left; }
      th { color: #7effdc; font-weight: normal; }
      .g { color: #7effa0; } .r { color: #ff7a6a; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .obj { margin: 8px 0; } .obj.done b { color: #8f8; } .obj ol { margin: 4px 0 0 0; padding-left: 26px; font-size: 19px; color: #c9a385; }
      li.done { color: #6fbf6f; text-decoration: line-through; } li.cur, span.cur { color: #ffe14d; } span.done { color: #6fbf6f; }
      .log { max-height: 60vh; overflow: auto; } .log b { color: #ff8a3d; }
      .map { position: relative; height: 170px; margin: 20px 0; background: linear-gradient(#5a2a1a, #a3401f); border: 3px solid #ff8a3d; }
      .pin { position: absolute; bottom: 30px; width: 4px; height: 50px; background: #fff0c9; }
      .pin span { position: absolute; bottom: 54px; left: -40px; width: 84px; font-size: 15px; text-align: center; line-height: 1; }
      .pin:nth-child(even) span { bottom: 86px; }
      .pin.target { background: #ff8a3d; } .pin.target span { color: #ffe14d; } .pin.off { opacity: .35; }
      .dot { position: absolute; bottom: 12px; width: 8px; height: 8px; }
      .ice { color: #bfe8ff; background: transparent; } .dot.ice { background: #bfe8ff; } .dot.rock { background: #8a5a44; } .dot.part { background: #b8c0c8; } .dot.scrap { background: #ff8a3d; }
      span.rock { color: #8a5a44; } span.part { color: #b8c0c8; } span.scrap { color: #ff8a3d; }
      .me { position: absolute; bottom: -26px; transform: translateX(-50%); color: #7effdc; font-size: 18px; }
      /* Mission setup */
      .setup { position: fixed; inset: 0; overflow: auto; background: radial-gradient(circle at 50% 0%, #10303a, #04030a 70%); padding: 18px 24px; box-sizing: border-box; }
      .setup::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(126,255,220,.04) 0 2px, transparent 2px 4px); }
      .setup-head h1 { font-family: 'Press Start 2P'; font-size: 20px; color: #7effdc; text-shadow: 0 0 12px #5fffd0; margin: 0 0 6px; }
      .setup-head p { color: #ffd9b0; font-size: 22px; margin: 0 0 12px; }
      .setup-grid { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 16px; }
      .setup section { background: rgba(10,30,34,.75); border: 3px solid #2a8c80; padding: 10px 12px; }
      .setup h2 { font-family: 'Press Start 2P'; font-size: 11px; color: #ff8a3d; margin: 10px 0 8px; }
      .setup h3 { font-family: 'Press Start 2P'; font-size: 10px; color: #7effdc; margin: 14px 0 4px; }
      .opt { display: block; width: 100%; text-align: left; margin-bottom: 6px; background: #0b1c20; color: #dff; border: 2px solid #1f5a54; padding: 6px 9px; font-family: 'VT323'; font-size: 19px; cursor: pointer; }
      .opt b { display: block; font-weight: normal; color: #fff; font-size: 21px; } .opt small { display: block; color: #7effdc; } .opt em { display: block; color: #a9c3bf; font-style: normal; font-size: 17px; }
      .opt.on { border-color: #ff8a3d; background: #20251a; box-shadow: 0 0 10px rgba(255,138,61,.4); }
      .note { color: #a9c3bf; font-size: 17px; }
      .meter { position: relative; background: #061214; border: 2px solid #2a8c80; padding: 4px 8px; margin-bottom: 8px; font-size: 19px; display: flex; justify-content: space-between; overflow: hidden; }
      .meter span, .meter b { position: relative; z-index: 1; font-weight: normal; }
      .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(126,255,160,.25); }
      .meter.bad { border-color: #ff5a4a; } .meter.bad i { background: rgba(255,90,74,.35); }
      .summary ul { padding-left: 20px; font-size: 19px; margin: 4px 0; }
      .errors { color: #ff7a6a; font-size: 19px; margin: 8px 0; } .ok { color: #7effa0; font-size: 20px; margin: 8px 0; }
      .launch { width: 100%; margin-top: 10px; font-family: 'Press Start 2P'; font-size: 14px; padding: 14px; background: #ff8a3d; color: #fff; border: 3px solid #fff0c9; cursor: pointer; }
      .launch[disabled] { background: #4a2a20; color: #999; cursor: not-allowed; }
      @media (max-width: 1000px) { .setup-grid, .cols { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hud">
      <button data-panel="inventory">INVENTORY</button>
      <button data-panel="objectives">OBJECTIVES</button>
      <button data-panel="resources">RESOURCES</button>
      <button data-panel="map">MAP</button>
      <button data-panel="log">LOG</button>
      <button data-panel="info">INFO</button>
    </div>
    <div id="ui-root"></div>
    <script src="https://rosebud.ai/sdk/v1/rosebud.js"></script>
    <script type="module" src="main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  </body>
</html>
